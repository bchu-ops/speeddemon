name: CI Pipeline
on: [push, pull_request]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run Linting (Ruff) - Warnings Only
        continue-on-error: true
        run: uv run ruff check backend --output-format=github

      - name: Run Tests (Pytest)
        run: |
          uv sync
          # uv run pytest --cov=backend/src --cov-report=xml  # Uncomment if you want to generate a coverage report

      - name: Verify Backend Docker Build
        # Uses the -f flag to find the recipe in deploy/
        run: docker build -f deploy/Dockerfile.backend -t test-backend-build .

      - name: Verify Frontend Docker Build
        run: docker build -f deploy/Dockerfile.frontend -t test-frontend-build .
