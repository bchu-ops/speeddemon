name: CI Pipeline
on: [push, pull_request]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run Linting (Ruff)
        run: uv run ruff check .

      - name: Run Tests (Pytest)
        run: |
          uv sync
          # uv run pytest --cov=src --cov-report=xml  # Uncomment if you want to generate a coverage report

      - name: Verify Docker Build
        # Uses the -f flag to find the recipe in deploy/
        run: docker build -f deploy/Dockerfile -t test-build .