name: SpeedDemon Deploy Pipeline

# on:                <-- Comment this out
#   push:            <-- Comment this out
#     branches: [main] 

on: workflow_dispatch # This allows you to run it MANUALLY from the UI instead


jobs:
  deploy-speeddemon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Build and Push the SpeedDemon Image
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/speeddemon:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/speeddemon:${{ github.sha }}

      # 2. Set Kubernetes Context (The "Passport")
      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }} 

      # 3. Deploy to Cluster & Inject 'app-secrets'
      - name: Deploy to Kubernetes
        run: |
          # Apply the networking and deployment manifests from the deploy/ folder
          kubectl apply -f deploy/k8s-deployment.yml
          kubectl apply -f deploy/k8s-service.yml
          
          # Force a Rolling Update using the new SHA tag
          kubectl set image deployment/speeddemon-deployment \
            backend=${{ secrets.DOCKERHUB_USERNAME }}/speeddemon:${{ github.sha }}
          
          # Check if the pods successfully pick up the 'app-secrets' and start
          kubectl rollout status deployment/speeddemon-deployment
