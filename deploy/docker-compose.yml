services:
  # Python Backend: API, ELT, and ML Inference
  backend:
    build:
      # Context '..' is vital because this file is inside /deploy
      context: .. 
      dockerfile: deploy/Dockerfile.backend
    container_name: speeddemon_backend
    ports:
      - "8000:8000"
    # Mount local source code for instant updates without rebuilding
    volumes:
      - ../backend:/app/backend
    # Pulls your local secrets (OPENAI_API_KEY, etc.) into the container
    env_file:
      - ../.env
    environment:
      - ENV=development
      - DEBUG=True
    
    # Modern Hot-Reload (Docker Compose V2.22+)
    # This detects changes on your laptop and updates the container instantly
    develop:
      watch:
        # If you run 'make sync' or 'uv add', rebuild the image
        - path: ../pyproject.toml
          action: rebuild
        - path: ../uv.lock
          action: rebuild
        # If you just edit Python files, sync them without restarting
        - path: ../backend/src
          action: sync
          target: /app/backend/src
  
  # React UI: Vite-based Hot Reload
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: speeddemon_frontend
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
    depends_on:
      - backend
    develop:
      watch:
        - path: ../frontend/src
          action: sync
          target: /app/src

  # ML Notebook: Research lab using the backend environment
  notebook:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: speeddemon_notebook
    ports:
      - "8888:8888"
    volumes:
      - ../backend:/app/backend
    env_file:
      - ../.env
    command: uv run jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root
